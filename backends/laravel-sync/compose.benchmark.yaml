name: tcc-laravel-sync-benchmark

x-app: &app
  build:
    context: .
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
    - "${CORPUS_DIR:?CORPUS_DIR is required}:/benchmark:ro"
    - ./docker/php/www-benchmark.conf:/usr/local/etc/php-fpm.d/zz-benchmark.conf:ro
    - ./docker/php/opcache-benchmark.ini:/usr/local/etc/php/conf.d/zz-opcache-benchmark.ini:ro
    - ./docker/php/disable-xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini:ro
    - ./docker/php/benchmark-entrypoint.sh:/usr/local/bin/benchmark-entrypoint.sh:ro
  entrypoint: ["sh", "/usr/local/bin/benchmark-entrypoint.sh"]
  environment: &app-env
    APP_NAME: TCC benchmark sync
    APP_ENV: production
    APP_DEBUG: "false"
    XDEBUG_MODE: "off"
    APP_KEY: ${APP_KEY:-base64:VFhYc3luY2JlbmNobWFya2xvY2FsZGV2a2V5}
    APP_URL: http://127.0.0.1:${BENCHMARK_PORT:-19998}
    BENCHMARK_MODE: "1"
    BENCHMARK_REFERENCE_DATE: ${REFERENCE_DATE:-2026-11-08}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: laravel_sync_benchmark
    DB_USERNAME: benchmark
    DB_PASSWORD: benchmark-local
    SESSION_DRIVER: array
    CACHE_STORE: array
    QUEUE_CONNECTION: sync
    LOG_CHANNEL: stderr
    LOG_LEVEL: error
    # Rastreamento distribuído: no-op por padrão (OTEL_ENABLED != 1); ligado só na rodada de
    # evidência de trace (make trace-evidence). O endpoint OTLP fica fora do orçamento de recursos.
    OTEL_ENABLED: ${OTEL_ENABLED:-0}
    OTEL_SERVICE_NAME: laravel-sync
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
    OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.02}
  # Alcança o Jaeger (network_mode host, OTLP 4318) sem alterar os limites de CPU/memória.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped
  ulimits:
    nofile:
      soft: 8192
      hard: 8192

services:
  api1:
    <<: *app
    cpus: ${API_CPUS:-0.45}
    mem_limit: ${API_MEMORY:-512m}
    memswap_limit: ${API_MEMORY:-512m}
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',9000); exit($$s?0:1);"]
      interval: 10s
      timeout: 5s
      retries: 6

  api2:
    <<: *app
    cpus: ${API_CPUS:-0.45}
    mem_limit: ${API_MEMORY:-512m}
    memswap_limit: ${API_MEMORY:-512m}
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',9000); exit($$s?0:1);"]
      interval: 10s
      timeout: 5s
      retries: 6

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "127.0.0.1:${BENCHMARK_PORT:-19998}:80"
    volumes:
      - ./docker/nginx/benchmark.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    cpus: ${NGINX_CPUS:-0.10}
    mem_limit: ${NGINX_MEMORY:-64m}
    memswap_limit: ${NGINX_MEMORY:-64m}
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 6

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: laravel_sync_benchmark
      MYSQL_USER: benchmark
      MYSQL_PASSWORD: benchmark-local
      MYSQL_ROOT_PASSWORD: benchmark-root-local
    volumes:
      - mysql_benchmark:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    cpus: ${MYSQL_CPUS:-0.50}
    mem_limit: ${MYSQL_MEMORY:-1856m}
    memswap_limit: ${MYSQL_MEMORY:-1856m}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 18

volumes:
  mysql_benchmark:
