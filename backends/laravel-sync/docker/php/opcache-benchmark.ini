; OPcache em modo produção para o baseline (montado apenas em compose.benchmark.yaml,
; sobrepondo docker/php/local.ini). validate_timestamps=0 elimina os stat() por request;
; seguro no benchmark porque o código é imutável durante a carga.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
