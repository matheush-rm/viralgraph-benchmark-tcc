; Pool PHP-FPM de produção para o baseline (montado apenas em compose.benchmark.yaml).
; pm = static elimina a fila do pm = dynamic padrão (5 filhos) sob alta concorrência.
; pm.max_children = 12: dimensionado para caber em API_MEMORY = 512 MiB com margem.
;   RSS medido por worker ~= 37-38 MiB (grande parte compartilhada via SHM do OPcache e COW);
;   master ~= 33 MiB; OPcache SHM = 128 MiB contado uma vez por container.
;   Orçamento aproximado: 512 - 33 (master) - 128 (OPcache) ~= 351 MiB para workers;
;   com SHM compartilhado o custo marginal real por worker é menor que o RSS cheio, então
;   12 workers cabem com folga. Validar o RSS real sob carga (Rail 1) antes de subir o valor.
[www]
user = www-data
group = www-data
listen = 9000

pm = static
pm.max_children = 12
pm.max_requests = 2000

; Diagnóstico opcional (não exposto pelo Nginx do benchmark).
pm.status_path = /fpm-status

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
